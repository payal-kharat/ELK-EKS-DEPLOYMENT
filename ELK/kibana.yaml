
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: elk-kibana
  namespace: elastic-system
spec:
  version: 9.3.0
  count: 1
  elasticsearchRef:
    name: elk-cluster
  podTemplate:
    spec:
      containers:
        - name: kibana
          resources:
            requests:
              memory: 1Gi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: 500m

