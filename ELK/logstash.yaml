
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: elastic-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:9.3.0
          ports:
            - name: beats
              containerPort: 5044
            - name: monitoring
              containerPort: 9600
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elk-cluster-es-elastic-user
                  key: elastic
            - name: LS_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          resources:
            requests:
              memory: 768Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: "1"
          volumeMounts:
            - name: pipeline
              mountPath: /usr/share/logstash/pipeline
              readOnly: true
            - name: elasticsearch-certs
              mountPath: /usr/share/logstash/config/certs
              readOnly: true
      volumes:
        - name: pipeline
          configMap:
            name: logstash-pipeline
        - name: elasticsearch-certs
          secret:
            secretName: elk-cluster-es-http-certs-public
---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: elastic-system
spec:
  selector:
    app: logstash
  ports:
    - name: beats
      port: 5044
      targetPort: 5044
    - name: monitoring
      port: 9600
      targetPort: 9600
  type: ClusterIP

